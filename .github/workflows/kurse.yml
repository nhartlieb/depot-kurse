name: Kurse abrufen

on:
  schedule:
    # Werktags ca. alle 30 Min. von 7 bis 23 Uhr (Zeiten in UTC)
    - cron: '7,37 6-21 * * 1-5'
    # Wochenende: nur Ethereum bewegt sich, alle 4 Std.
    - cron: '23 6,10,14,18 * * 0,6'
  workflow_dispatch:
  # Nach Änderungen am Abruf sofort einmal laufen
  push:
    branches: [main]
    paths: ['fetch_quotes.py', 'history.py', 'intraday.py', 'stocks.py', '.github/workflows/kurse.yml', 'trigger/**']

permissions:
  contents: write

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Kurse holen
        run: python3 fetch_quotes.py
      - name: Tageskurse (höchstens alle 6 Std.)
        run: python3 history.py ${{ github.event_name != 'schedule' && '--force' || '' }} || echo 'Historie fehlgeschlagen'
      - name: Kurse der Fondsbestandteile (höchstens alle 6 Std.)
        run: python3 stocks.py ${{ github.event_name != 'schedule' && '--force' || '' }} || echo 'Aktienkurse fehlgeschlagen'
      - name: Intraday-Kurse
        run: python3 intraday.py || echo 'Intraday fehlgeschlagen'
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp quotes.json "$RUNNER_TEMP/q.json"; [ -f history.json ] && cp history.json "$RUNNER_TEMP/h.json"; [ -f intraday.json ] && cp intraday.json "$RUNNER_TEMP/i.json"; [ -f stocks.json ] && cp stocks.json "$RUNNER_TEMP/s.json"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/q.json" quotes.json; [ -f "$RUNNER_TEMP/h.json" ] && cp "$RUNNER_TEMP/h.json" history.json; [ -f "$RUNNER_TEMP/i.json" ] && cp "$RUNNER_TEMP/i.json" intraday.json; [ -f "$RUNNER_TEMP/s.json" ] && cp "$RUNNER_TEMP/s.json" stocks.json
            git add quotes.json history.json intraday.json stocks.json
            if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
            git commit -qm "Kurse $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')" && git push -q && exit 0
            sleep 7
          done
          exit 1
